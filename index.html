<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Turki Portfolio</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }


    body{
  background:
  radial-gradient(circle at top,
  rgba(250,204,21,0.08),
  transparent 35%),
  #050505;

  color:#F5F5F5;
  overflow-x:hidden;

  min-height:100vh;
}

    .hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  position:relative;

  animation:fadeIn 1.5s ease;
} 
    
    .glow{
      position:absolute;
      width:350px;
      height:350px;
      background:#FACC15;
      filter:blur(120px);
      opacity:0.15;
      border-radius:50%;
      z-index:0;
    }

    h1{
      font-size:70px;
      color:white;
      letter-spacing:2px;
      z-index:1;
    }

    .subtitle{
      margin-top:15px;
      font-size:20px;
      color:#999;
      z-index:1;
    }

    .cards{
      margin-top:50px;
      display:flex;
      gap:20px;
      z-index:1;
      flex-wrap:wrap;
      justify-content:center;
    }

.card{
  width:220px;
  height:130px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.03);
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  transition:0.4s ease;
  backdrop-filter:blur(10px);
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(250,204,21,0.15),
    transparent
  );
  transform:translateX(-100%);
  transition:0.6s;
}

.card:hover::before{
  transform:translateX(100%);
}

.card:hover{
  transform:
    translateY(-10px)
    scale(1.03);

  border-color:#FACC15;

  box-shadow:
    0 0 25px rgba(250,204,21,0.2),
    0 0 50px rgba(250,204,21,0.08);
}
    
    
    .yellow{
      color:#FACC15;
    }
  
@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(30px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
.grid{
  position:absolute;
  width:100%;
  height:100%;

  background-image:
  linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

  background-size:50px 50px;

  z-index:0;
}

.card{
  flex-direction:column;
  gap:10px;
}

.card span{
  font-size:35px;
} 
}
  </style>
</head>

<body>

  <section class="hero">

  <div class="grid"></div>
  <div class="glow"></div>

  <h1>
    Turki <span class="yellow">Portfolio</span>
  </h1>

  <p class="subtitle">
    Academic • Projects • Future
  </p>

  <div class="cards">

    <div class="card">
      <span>👨‍💻</span>
      <p>About Me</p>
    </div>

    <div class="card">
      <span>📜</span>
      <p>Certificates</p>
    </div>

    <div class="card">
      <span>📝</span>
      <p>My Letters</p>
    </div>

    <div class="card">
      <span>🚀</span>
      <p>Projects</p>
    </div>

  </div>

</section>
